name: R3 Frontend Contract Repair

on:
  push:
    branches:
      - r3-dual-identity-staging

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile approved frontend contract and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          # Remove obsolete invitation identity compatibility fields. The approved
          # invitation command is email-only; Doctor re-auth password remains separate.
          path = 'frontend/src/doctor/StaffAssignmentDrawer.tsx'
          replace(path, "type InviteWireCompatibility = {\n  firstName: string;\n  lastName: string;\n  email: string;\n  mobileNumber: string;\n};\n\n", "")
          replace(path, "  | ({\n      role: 'INVITE_NEW';\n      identifier: string;\n      assignmentType: 'CLINIC_SECRETARY';\n      authorityBundles: string[];\n      requestedCancelClinicDay: boolean;\n      password?: string;\n    } & InviteWireCompatibility)\n  | ({\n      role: 'INVITE_NEW';\n      identifier: string;\n      assignmentType: 'SUBSTITUTE_SECRETARY';\n      coverageMode: 'ONE_SERVICE_DATE' | 'DATE_RANGE';\n      fromServiceDate: string;\n      toServiceDate: string;\n    } & InviteWireCompatibility);", "  | {\n      role: 'INVITE_NEW';\n      identifier: string;\n      assignmentType: 'CLINIC_SECRETARY';\n      authorityBundles: string[];\n      requestedCancelClinicDay: boolean;\n      password?: string;\n    }\n  | {\n      role: 'INVITE_NEW';\n      identifier: string;\n      assignmentType: 'SUBSTITUTE_SECRETARY';\n      coverageMode: 'ONE_SERVICE_DATE' | 'DATE_RANGE';\n      fromServiceDate: string;\n      toServiceDate: string;\n    };")
          replace(path, "      const wireCompatibility: InviteWireCompatibility = {\n        firstName: '',\n        lastName: '',\n        email: identifier,\n        mobileNumber: '',\n      };\n", "")
          replace(path, "              identifier,\n              ...wireCompatibility,\n              assignmentType: role,", "              identifier,\n              assignmentType: role,", expected=2)

          # Account access tests now assert the approved dual login identifier.
          path = 'frontend/src/auth/LoginPage.test.tsx'
          replace(path, "/Only your email address is remembered/i", "/Only your mobile number or email address is remembered/i")
          replace(path, "screen.getByLabelText('Email address')", "screen.getByLabelText('Mobile # or email address')", expected=3)
          replace(path, "it('remembers only the email address when requested'", "it('remembers only the login identifier when requested'")
          replace(path, "localStorage.getItem('clinic-queueing.remembered-email')", "localStorage.getItem('clinic-queueing.remembered-identifier')")

          path = 'frontend/src/auth/AccountAccessPages.test.tsx'
          replace(path, "screen.getByLabelText('Email address')", "screen.getByLabelText('Mobile # or email address')")

          path = 'frontend/src/auth/CreateAccountPage.test.tsx'
          replace(path, "    expect(screen.getByPlaceholderText('Enter your email address')).toBeInTheDocument();\n    expect(screen.getByPlaceholderText('Enter your mobile number')).toBeInTheDocument();", "    expect(\n      screen.getByPlaceholderText('Enter mobile # or email address'),\n    ).toBeInTheDocument();")
          replace(path, "    const password = screen.getByPlaceholderText('Create a password');", "    await user.type(\n      screen.getByPlaceholderText('Enter mobile # or email address'),\n      'doctor@example.com',\n    );\n    const password = screen.getByPlaceholderText('Create a password');")
          replace(path, "      emailVerificationRequired: true,\n      emailVerificationExpiresAt: '2026-09-01T00:00:00.000Z',", "      verificationChannel: 'EMAIL',\n      verificationRequired: true,\n      verificationExpiresAt: '2026-09-01T00:00:00.000Z',")
          replace(path, "    await user.type(screen.getByPlaceholderText('Enter your email address'), 'secretary@example.com');\n    await user.type(screen.getByPlaceholderText('Enter your mobile number'), '09171234567');", "    await user.type(\n      screen.getByPlaceholderText('Enter mobile # or email address'),\n      'secretary@example.com',\n    );")

          # Secretary invitation tests now follow the approved email-only workflow.
          path = 'frontend/src/doctor/AuthoritativeClinicStaffTab.test.tsx'
          old_details = "    await user.type(screen.getByLabelText('First Name'), 'Anna');\n    await user.type(screen.getByLabelText('Last Name'), 'Dela Cruz');\n    await user.type(\n      screen.getByLabelText('Email Address'),\n      'anna@example.test',\n    );\n    await user.type(screen.getByLabelText('Mobile Number'), '09181112222');"
          new_details = "    await user.type(\n      screen.getByLabelText('Secretary Email Address'),\n      'anna@example.test',\n    );"
          replace(path, old_details, new_details, expected=2)
          replace(path, "        assignmentType: 'CLINIC_SECRETARY',\n        firstName: 'Anna',\n        authorityBundles:", "        assignmentType: 'CLINIC_SECRETARY',\n        identifier: 'anna@example.test',\n        authorityBundles:")

          path = 'frontend/src/doctor/StaffAssignmentDrawer.invitation-retry.test.tsx'
          replace(path, "    await user.type(screen.getByLabelText('First Name'), 'Anna');\n    await user.type(screen.getByLabelText('Last Name'), 'Dela Cruz');\n    await user.type(screen.getByLabelText('Email Address'), 'anna@example.ocm');\n    await user.type(screen.getByLabelText('Mobile Number'), '09181112222');", "    await user.type(\n      screen.getByLabelText('Secretary Email Address'),\n      'anna@example.ocm',\n    );")
          replace(path, "        email: 'anna@example.com',\n        firstName: 'Anna',\n        lastName: 'Dela Cruz',\n        mobileNumber: '09181112222',", "        identifier: 'anna@example.com',")
          PY

          if git diff --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi

          cd frontend
          npm ci
          npm run verify
          cd ..

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/auth/AccountAccessPages.test.tsx \
                  frontend/src/auth/CreateAccountPage.test.tsx \
                  frontend/src/auth/LoginPage.test.tsx \
                  frontend/src/doctor/AuthoritativeClinicStaffTab.test.tsx \
                  frontend/src/doctor/StaffAssignmentDrawer.invitation-retry.test.tsx \
                  frontend/src/doctor/StaffAssignmentDrawer.tsx
          git commit -m 'test: align frontend with dual identity and email invitations'
          git push origin HEAD:r3-dual-identity-staging
