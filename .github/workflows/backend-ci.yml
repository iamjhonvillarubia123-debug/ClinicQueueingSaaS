name: Backend CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-ci.yml'

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - name: Lint F2 backend changes
        run: >-
          npx eslint
          src/booking/booking.controller.ts
          src/booking/booking.module.ts
          src/booking/public-booking-entry.service.ts
          src/booking/public-booking-entry.service.spec.ts
          src/booking/dto/create-public-booking-draft.dto.ts
          src/booking/dto/replace-public-booking-draft.dto.ts
          src/public-routing/public-routing.module.ts
      - name: Check development acceptance scripts
        run: |
          node --check scripts/create-dev-public-fixture.cjs
          node --check scripts/show-dev-latest-booking-otp.cjs
      - run: npm test -- --runInBand public-booking-entry.service.spec.ts
      - run: npm run build
