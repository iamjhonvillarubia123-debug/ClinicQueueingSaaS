name: Backend CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-ci.yml'

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - name: Lint full backend repository
        run: npm run lint:check
      - name: Check development acceptance scripts
        run: |
          node --check scripts/create-dev-public-fixture.cjs
          node --check scripts/show-dev-latest-booking-otp.cjs
          node --check scripts/show-dev-latest-booking-group-recovery-otp.cjs
          node --check scripts/show-dev-latest-appointment-recovery-otp.cjs
          node --check scripts/show-dev-latest-account-link.cjs
      - name: Run full backend unit test suite
        run: npm test -- --runInBand
      - run: npm run build
