name: Backend CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-ci.yml'

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - name: Lint frontend-facing backend integration
        run: >-
          npx eslint
          src/booking/booking.controller.ts
          src/booking/booking.module.ts
          src/booking/booking.service.ts
          src/booking/booking-confirmation.service.ts
          src/booking/public-booking-entry.service.ts
          src/booking/public-booking-entry.service.spec.ts
          src/booking/public-booking-replacement.service.ts
          src/booking/public-booking-replacement.service.spec.ts
          src/booking/public-booking-duplicate-use-existing.service.ts
          src/booking/public-booking-duplicate-use-existing.service.spec.ts
          src/booking/dto/create-booking-draft.dto.ts
          src/booking/dto/create-public-booking-draft.dto.ts
          src/booking/dto/replace-public-booking-draft.dto.ts
          src/public-routing/public-routing.module.ts
          src/patient-access/appointment-recovery.controller.ts
          src/patient-access/booking-group-recovery.controller.ts
          src/patient-access/public-booking-recovery.controller.ts
          src/patient-access/public-booking-recovery.service.ts
          src/patient-access/patient-access.module.ts
      - name: Check development acceptance scripts
        run: |
          node --check scripts/create-dev-public-fixture.cjs
          node --check scripts/show-dev-latest-booking-otp.cjs
          node --check scripts/show-dev-latest-booking-group-recovery-otp.cjs
          node --check scripts/show-dev-latest-appointment-recovery-otp.cjs
      - name: Test public booking, patient recovery, and clinic configuration controls
        run: >-
          npm test -- --runInBand
          public-booking-entry.service.spec.ts
          public-booking-replacement.service.spec.ts
          public-booking-duplicate-use-existing.service.spec.ts
          appointment-recovery.service.spec.ts
          booking-group-recovery.service.spec.ts
          practice-location.service.spec.ts
          practice-location.controller.spec.ts
          practice-location-configuration-draft.service.spec.ts
      - run: npm run build
