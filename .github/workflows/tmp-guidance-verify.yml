name: Temporary Clinic Guidance Verify

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/tmp-guidance-verify.yml'

jobs:
  verify-guidance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        id: tests
        continue-on-error: true
        run: npm run test
      - name: Build
        run: npm run build
      - name: Preserve test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
