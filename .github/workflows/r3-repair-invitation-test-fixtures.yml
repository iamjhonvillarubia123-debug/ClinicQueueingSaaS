name: R3 Repair Invitation Test Fixtures

on:
  push:
    branches:
      - r3-dual-identity-staging

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r3-dual-identity-staging
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run prisma:generate
      - name: Repair stale invitation fixtures
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/practice-staff/secretary-invitation.service.spec.ts';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              "      practiceLocationId: 'clinic-1',\n      normalizedIdentifier: 'jane@example.test',",
              "      practiceLocationId: 'clinic-1',\n      requestedAssignmentType: SecretaryInvitationAssignmentType.CLINIC_SECRETARY,\n      normalizedIdentifier: 'jane@example.test',",
            ],
            [
              "      practiceLocationId: 'clinic-1',\n      normalizedIdentifier: 'wrong@example.test',",
              "      practiceLocationId: 'clinic-1',\n      requestedAssignmentType: SecretaryInvitationAssignmentType.CLINIC_SECRETARY,\n      normalizedIdentifier: 'wrong@example.test',",
            ],
          ];
          for (const [before, after] of replacements) {
            source = source.split(before).join(after);
          }
          fs.writeFileSync(path, source);
          NODE
      - run: npx eslint src/practice-staff/secretary-invitation.service.spec.ts
      - run: npm test -- --runInBand secretary-invitation.service.spec.ts
      - name: Commit fixture correction
        run: |
          if git diff --quiet -- src/practice-staff/secretary-invitation.service.spec.ts; then
            echo "No fixture changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/practice-staff/secretary-invitation.service.spec.ts
          git commit -m "align invitation update test fixtures with assignment type"
          git push origin HEAD:r3-dual-identity-staging
