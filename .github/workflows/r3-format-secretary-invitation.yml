name: R3 Format Secretary Invitation

on:
  push:
    branches:
      - r3-dual-identity-staging

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r3-dual-identity-staging
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run prisma:generate
      - name: Apply project formatter rules
        run: >-
          npx eslint --fix
          src/practice-staff/secretary-invitation.service.ts
          src/practice-staff/secretary-invitation.service.spec.ts
          src/practice-staff/dto/create-secretary-invitation.dto.ts
          src/practice-staff/dto/update-secretary-invitation.dto.ts
      - name: Commit formatter-only changes
        run: |
          if git diff --quiet -- src/practice-staff/secretary-invitation.service.ts src/practice-staff/secretary-invitation.service.spec.ts src/practice-staff/dto/create-secretary-invitation.dto.ts src/practice-staff/dto/update-secretary-invitation.dto.ts; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/practice-staff/secretary-invitation.service.ts src/practice-staff/secretary-invitation.service.spec.ts src/practice-staff/dto/create-secretary-invitation.dto.ts src/practice-staff/dto/update-secretary-invitation.dto.ts
          git commit -m "format secretary invitation controls"
          git push origin HEAD:r3-dual-identity-staging
