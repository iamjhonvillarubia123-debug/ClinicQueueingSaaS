<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <title>Clinic Queueing</title>
    <style>
      /* Keep the Address and Timezone captions and control top edges aligned. */
      .clinic-basic-layout > label:nth-child(3),
      .clinic-basic-layout > label:nth-child(5) {
        display: block;
        align-self: start;
      }

      .clinic-basic-layout > label:nth-child(3) > textarea,
      .clinic-basic-layout > label:nth-child(5) > div {
        display: block;
        margin-top: 8px;
      }

      /* Use one explicit value typography across all Basic Information fields. */
      .clinic-basic-layout input,
      .clinic-basic-layout textarea,
      .clinic-basic-layout select,
      .clinic-basic-layout button[aria-haspopup='listbox'] {
        font-family: inherit;
        font-size: 14px;
        font-weight: 400;
        color: #17191c;
      }

      .clinic-basic-layout input::placeholder,
      .clinic-basic-layout textarea::placeholder {
        font-size: 14px;
        font-weight: 400;
        color: #7b8490;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
